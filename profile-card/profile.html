<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profile.css"/>
    <title>Profile Card</title>
</head>
<body>
    <main class="card">
        <div class="avatar-wrap">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200" alt="Anjali Rana" />
            <span class="status-dot"></span>
        </div>

        <h1>Anjali Rana</h1>
        <p class="role">Frontend Developer</p>

        <p class="bio">Building clean and responsive web interfaces. Learning CSS step by step.</p>

        <div class="stats">
            <div>
                <strong>128</strong>
                <span>Posts</span>
            </div>
            <div>
                <strong>2.4k</strong>
                <span>Followers</span>
            </div>
            <div>
                <strong>310</strong>
                <span>Following</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-follow">Follow</button>
            <button class="btn btn-msg">Message</button>
        </div>

        <div class="tags">
            <span>Figma</span>
            <span>Design systems</span>
            <span>Prototyping</span>
        </div>

    </main>
</body>
</html>
