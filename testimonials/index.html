<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="container">
    <div class="header">
      <h1>What readers say</h1>
      <p>Three people, three honest opinions.</p>
    </div>

    <div class="grid">
      <div class="card">
        <p class="quote">The clearest explanation of flexbox I've found anywhere.</p>
        <div class="author">
          <div class="avatar blue">AM</div>
          <div class="info">
            <h3>Asha Mehta</h3>
            <span>Frontend dev</span>
          </div>
        </div>
      </div>

      <div class="card">
        <p class="quote">Built my first real page in a weekend. Still amazed.</p>
        <div class="author">
          <div class="avatar green">RK</div>
          <div class="info">
            <h3>Ravi Kumar</h3>
            <span>Student</span>
          </div>
        </div>
      </div>

      <div class="card">
        <p class="quote">Short, practical, and it respects your time.</p>
        <div class="author">
          <div class="avatar yellow">MS</div>
          <div class="info">
            <h3>Meera Shah</h3>
            <span>Teacher</span>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
